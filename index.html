<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoralReefMap — Interaktive Korallenriff Karte</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1>🪸 CoralReefMap</h1>
            <p class="subtitle">Interaktive Karte zur Überwachung von Korallenriffen weltweit</p>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="panel">
                <h3>🪸 Korallenriffe</h3>
                <div class="layer-control">
                    <label class="checkbox-label">
                        <input type="checkbox" id="layer-coral-warm" checked>
                        <span>Warmwasser-Korallenriffe</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="layer-coral-cold" checked>
                        <span>Kaltwasser-Korallenriffe</span>
                    </label>
                </div>
            </div>

            <div class="panel">
                <h3>🌡️ Temperatur-Daten</h3>
                <div class="layer-control">
                    <label class="checkbox-label">
                        <input type="checkbox" id="layer-sst">
                        <span>Wassertemperatur (SST)</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="layer-dhw">
                        <span>Hitzestress (DHW)</span>
                    </label>
                </div>
            </div>

            <div class="panel">
                <h3>🌊 Wasserqualität</h3>
                <div class="layer-control">
                    <label class="checkbox-label">
                        <input type="checkbox" id="layer-water-quality">
                        <span>Wasserklarheit (Trübung)</span>
                    </label>
                </div>
            </div>

            <div class="panel">
                <h3>🔬 Verschmutzung</h3>
                <div class="layer-control">
                    <label class="checkbox-label">
                        <input type="checkbox" id="layer-microplastics">
                        <span>Mikroplastik-Messungen</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="layer-incidents">
                        <span>Öl- & Chemie-Vorfälle</span>
                    </label>
                </div>
            </div>

            <div class="panel">
                <h3>⚓ Häfen & Tauchspots</h3>
                <div class="layer-control">
                    <label class="checkbox-label">
                        <input type="checkbox" id="layer-harbours">
                        <span>Häfen weltweit</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="layer-dive-sites">
                        <span>Tauchspots</span>
                    </label>
                </div>
            </div>

            <div class="panel info-panel">
                <h3>ℹ️ Legende</h3>
                <div id="legend-content">
                    <p class="legend-placeholder">Wähle einen Layer aus um Details zu sehen</p>
                </div>
            </div>
        </aside>

        <!-- Map Container -->
        <main class="map-container">
            <div id="map"></div>
            
            <!-- Loading Indicator -->
            <div id="loading-indicator" class="loading-indicator" style="display: none;">
                <div class="spinner"></div>
                <p>Lade Daten...</p>
            </div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Custom JS -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
